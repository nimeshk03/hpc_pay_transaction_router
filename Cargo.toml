[package]
name = "transaction_router"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
redis = ["dep:redis"]
kafka = ["dep:rdkafka"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing", "dep:tracing-opentelemetry"]
full = ["redis", "kafka", "telemetry"]

[dependencies]
uuid = {version = "1.6", features = ["v4", "serde"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_yaml = "0.9"
chrono = {version = "0.4", features = ["serde"]}
rust_decimal = {version = "1.33", features = ["serde"]}
thiserror = "1.0"
notify = "6.1"
tokio = {version = "1.35", features = ["sync", "time", "rt-multi-thread"]}
rand = "0.8"

# Optional dependencies for advanced features
redis = { version = "0.24", features = ["tokio-comp"], optional = true }
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
opentelemetry = { version = "0.21", optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"
tokio = { version = "1.35", features = ["full", "test-util"] }

[[bench]]
name = "performance_benchmarks"
harness = false
